<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Chat – Salons publics</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    :root { color-scheme: dark; }
    * { scrollbar-width: thin; }
    .scroll-thin::-webkit-scrollbar { width: 6px; }
    .scroll-thin::-webkit-scrollbar-thumb { background: #3f3f46; border-radius: 8px; }

    /* Animations */
    @keyframes fadeInUp { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    .anim-fade { animation: fadeIn .25s ease-out; }
    .anim-fade-up { animation: fadeInUp .25s ease-out; }
  </style>
</head>
<body class="bg-zinc-900 text-zinc-100 h-screen flex flex-col">
  <!-- Header -->
  <header class="shrink-0 border-b border-zinc-800 bg-zinc-900/80 backdrop-blur">
    <div class="max-w-7xl mx-auto p-3 flex items-center gap-3">
      <div class="h-8 w-8 rounded-xl bg-indigo-600 grid place-items-center font-bold">C</div>
      <h1 class="font-semibold">Chat – Salons publics</h1>

      <div class="ml-auto flex items-center gap-2" id="auth-area"><!-- boutons auth injectés --></div>

      <!-- Amis / demandes -->
      <button id="friends-btn" class="relative px-3 py-1 rounded-lg bg-zinc-800 hover:bg-zinc-700 transition">
        Amis
        <span id="badge-requests" class="hidden absolute -top-1 -right-1 text-[10px] bg-red-600 rounded-full px-1">0</span>
      </button>
    </div>
  </header>

  <!-- Main full screen -->
  <main class="grow">
    <div class="max-w-7xl mx-auto h-full grid grid-cols-12 gap-4 p-3 md:p-4">
      <!-- Sidebar rooms -->
      <aside class="col-span-12 md:col-span-3 lg:col-span-3 border border-zinc-800 rounded-2xl p-3 flex flex-col anim-fade">
        <div class="flex items-center gap-2 mb-3">
          <h2 class="text-sm font-semibold text-zinc-300">Salons</h2>
          <button id="new-room-btn" class="ml-auto text-xs px-2 py-1 rounded-lg bg-zinc-800 hover:bg-zinc-700 transition">+ Créer</button>
        </div>
        <ul id="room-list" class="scroll-thin overflow-auto pr-1 space-y-1 grow"></ul>
      </aside>

      <!-- Chat area -->
      <section class="col-span-12 md:col-span-9 lg:col-span-9 flex flex-col border border-zinc-800 rounded-2xl overflow-hidden h-full anim-fade">
        <!-- Room header -->
        <div class="flex items-center gap-2 p-3 border-b border-zinc-800 bg-zinc-900">
          <div class="text-sm">Salon : <span id="current-room" class="font-semibold">(aucun)</span></div>
          <div class="ml-auto text-xs text-zinc-400" id="room-owner-hint"></div>
        </div>

        <!-- Messages full height -->
        <div id="messages" class="flex-1 overflow-auto p-3 scroll-thin space-y-3 bg-zinc-950"></div>

        <!-- Composer -->
        <form id="message-form" class="p-3 border-t border-zinc-800 bg-zinc-900 flex items-end gap-2">
          <textarea id="message-input" rows="1" placeholder="Écrire un message…"
            class="flex-1 resize-none bg-zinc-800 rounded-xl p-3 focus:outline-none focus:ring-2 focus:ring-indigo-500 transition"></textarea>
          <button id="send-btn"
            class="px-4 py-2 rounded-xl bg-indigo-600 hover:bg-indigo-500 disabled:opacity-50 disabled:cursor-not-allowed transition"
            disabled>Envoyer</button>
        </form>
      </section>
    </div>
  </main>

  <!-- Friends drawer -->
  <div id="friends-drawer" class="fixed inset-0 bg-black/40 hidden anim-fade">
    <div class="absolute right-0 top-0 h-full w-full max-w-md bg-zinc-900 border-l border-zinc-800 p-4 anim-fade-up">
      <div class="flex items-center mb-3">
        <h3 class="font-semibold">Amis & demandes</h3>
        <button id="close-friends" class="ml-auto text-zinc-300 hover:text-white transition">Fermer</button>
      </div>

      <div class="grid grid-cols-2 gap-3">
        <section class="border border-zinc-800 rounded-xl p-3">
          <div class="text-sm font-medium mb-2">Utilisateurs</div>
          <ul id="user-list" class="space-y-1 max-h-[35vh] overflow-auto scroll-thin"></ul>
        </section>
        <section class="border border-zinc-800 rounded-xl p-3">
          <div class="text-sm font-medium mb-2">Demandes reçues</div>
          <ul id="request-list" class="space-y-1 max-h-[35vh] overflow-auto scroll-thin"></ul>
        </section>
      </div>

      <section class="border border-zinc-800 rounded-xl p-3 mt-3">
        <div class="text-sm font-medium mb-2">Mes amis</div>
        <ul id="friends-list" class="space-y-1 max-h-[25vh] overflow-auto scroll-thin"></ul>
      </section>
    </div>
  </div>

  <script type="module" src="./app.js"></script>
</body>
</html>
