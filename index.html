<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Chat instantané sécurisé</title>

  <!-- TailwindCSS via CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Styles rapides -->
  <style>
    * { scrollbar-width: thin; }
    .scroll-thin::-webkit-scrollbar { width: 6px; }
    .scroll-thin::-webkit-scrollbar-thumb { background: #3f3f46; border-radius: 8px; }
  </style>
</head>
<body class="bg-zinc-900 text-zinc-100 min-h-screen">

  <!-- Barre de titre -->
  <header class="sticky top-0 border-b border-zinc-800 bg-zinc-900/80 backdrop-blur p-3 flex justify-between items-center">
    <div class="flex items-center gap-2">
      <div class="h-8 w-8 bg-indigo-600 rounded-xl grid place-items-center font-bold">C</div>
      <h1 class="font-semibold">Chat instantané sécurisé</h1>
    </div>
    <div id="auth-area" class="flex items-center gap-2"></div>
  </header>

  <!-- Structure principale -->
  <main class="max-w-6xl mx-auto grid grid-cols-12 gap-4 p-3">
    <!-- Sidebar -->
    <aside class="col-span-12 md:col-span-3 border border-zinc-800 rounded-2xl p-3">
      <div class="flex justify-between items-center mb-3">
        <h2 class="text-sm font-semibold text-zinc-300">Salons</h2>
        <button id="new-room-btn" class="text-xs px-2 py-1 rounded-lg bg-zinc-800 hover:bg-zinc-700">+ Créer</button>
      </div>
      <ul id="room-list" class="space-y-1 scroll-thin max-h-[60vh] overflow-auto pr-1"></ul>
    </aside>

    <!-- Zone de chat -->
    <section class="col-span-12 md:col-span-9 flex flex-col border border-zinc-800 rounded-2xl overflow-hidden">
      <div class="p-3 border-b border-zinc-800 bg-zinc-900 flex justify-between items-center">
        <div>Salon : <span id="current-room" class="font-semibold">(aucun)</span></div>
      </div>

      <div id="messages" class="flex-1 overflow-auto p-3 scroll-thin space-y-3 bg-zinc-950"></div>

      <form id="message-form" class="p-3 border-t border-zinc-800 bg-zinc-900 flex gap-2">
        <textarea id="message-input" rows="1" placeholder="Écrire un message…" class="flex-1 bg-zinc-800 rounded-xl p-3 resize-none focus:outline-none focus:ring-2 focus:ring-indigo-500"></textarea>
        <button id="send-btn" class="px-4 py-2 rounded-xl bg-indigo-600 hover:bg-indigo-500 disabled:opacity-50" disabled>Envoyer</button>
      </form>
    </section>
  </main>

  <!-- Script principal -->
  <script type="module" src="./app.js"></script>
</body>
</html>
