<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Redirection – Chat Ultra</title>
  <script>
    (function() {
      var ua = navigator.userAgent;
      var isOldiOS = /iPhone|iPad|iPod/.test(ua) && /OS [0-9_]{2,}/.test(ua) && parseInt(ua.match(/OS (\d+)_/)[1], 10) <= 9;
      var isOldAndroid = /Android [0-5]/.test(ua);
      var isOldBrowser = isOldiOS || isOldAndroid || !!window.MSInputMethodContext; // IE fallback

      if (isOldBrowser) {
        window.location.href = "./legacy/index.html";
      } else {
        window.location.href = "./modern/index.html";
      }
    })();
  </script>
  <style>
    body { font-family: sans-serif; background: #111; color: #ddd; display: flex; align-items: center; justify-content: center; height: 100vh; }
  </style>
</head>
<body>
  <p>Chargement de Chat Ultra...</p>
</body>
</html>
